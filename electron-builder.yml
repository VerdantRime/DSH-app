appId: com.mao.dsh-workdesk
productName: DeepSeek工作台
directories:
  output: release
files:
  - out/**/*
  - package.json
win:
  icon: build/icon.png
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: DeepSeek工作台-${version}-portable.exe
